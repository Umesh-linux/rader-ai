<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rader AI</title>


    <!-- Markdown -->

    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>


    <!-- Security for rendered Markdown -->

    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js">
    </script>


    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


    <!-- ==================================================
                         SIDEBAR
    =================================================== -->

    <aside class="sidebar">


        <div class="brand">

            <div class="brand-logo">
                R
            </div>

            <div>

                <h1>Rader AI</h1>

                <span>
                    Intelligent AI Assistant
                </span>

            </div>

        </div>


        <button
            id="newChatButton"
            class="new-chat-button"
        >

            <span>＋</span>

            New Chat

        </button>


        <div class="history-section">

            <div class="history-title">
                Recent Chats
            </div>

            <div id="chatHistory"></div>

        </div>


        <div class="sidebar-footer">

            <div class="online-status">

                <span class="online-dot"></span>

                Rader AI Online

            </div>

        </div>


    </aside>



    <!-- ==================================================
                         MAIN AREA
    =================================================== -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">

            <div class="mobile-brand">

                <div class="brand-logo">
                    R
                </div>

                <strong>
                    Rader AI
                </strong>

            </div>


            <div class="model-name">

                <strong>
                    Rader AI
                </strong>

                <small>
                    LLM Powered Assistant
                </small>

            </div>

        </header>



        <!-- ==================================================
                           CHAT AREA
        =================================================== -->

        <section
            id="chatContainer"
            class="chat-container"
        >


            <!-- WELCOME -->

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-logo">
                    R
                </div>


                <h2>
                    How can I help you?
                </h2>


                <p>

                    Ask Rader AI anything.

                    Every prompt is processed dynamically
                    by the language model.

                </p>


                <div class="suggestions">


                    <button
                        onclick="useSuggestion(
                        'Explain artificial intelligence in simple words'
                        )"
                    >

                        Explain AI

                    </button>


                    <button
                        onclick="useSuggestion(
                        'Write a Python program for a calculator'
                        )"
                    >

                        Write Python Code

                    </button>


                    <button
                        onclick="useSuggestion(
                        'Give me five innovative startup ideas'
                        )"
                    >

                        Startup Ideas

                    </button>


                    <button
                        onclick="useSuggestion(
                        'Explain Java programming with Easy, Medium, and Hard examples'
                        )"
                    >
                        Java Multi-Tier Guide
                    </button>

                    <button
                        onclick="useSuggestion(
                        'Give me AI technical interview questions and answers for recruiters'
                        )"
                    >
                        Recruiter AI Q&A
                    </button>

                    <button
                        onclick="useSuggestion(
                        'Compare ChatGPT, Gemini, Claude, and Astra'
                        )"
                    >
                        Compare AI Models
                    </button>

                </div>

            </div>

        </section>



        <!-- ==================================================
                         INPUT AREA
        =================================================== -->

        <div class="input-area">


            <form
                id="chatForm"
                class="input-form"
            >


                <textarea
                    id="messageInput"
                    placeholder="Message Rader AI..."
                    rows="1"
                ></textarea>


                <button
                    id="sendButton"
                    type="submit"
                >

                    ➤

                </button>


            </form>


            <div class="disclaimer">

                Rader AI can make mistakes.
                Verify important information.

            </div>


        </div>


    </main>


</div>


<script src="app.js"></script>


</body>

</html>
